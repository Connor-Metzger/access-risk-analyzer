# Security requirement 11: bind to localhost only; never expose publicly.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
# Hide the Deploy button: this dashboard must never be published.
toolbarMode = "viewer"
